openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: resumes
    description: Resume analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /resumes:
    get:
      operationId: listResumes
      tags: [resumes]
      summary: List all analyzed resumes
      responses:
        "200":
          description: List of resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
    post:
      operationId: analyzeResume
      tags: [resumes]
      summary: Submit a resume for AI analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeResumeBody"
      responses:
        "201":
          description: Analysis complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resumes/{id}:
    get:
      operationId: getResume
      tags: [resumes]
      summary: Get a specific resume analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resume analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteResume
      tags: [resumes]
      summary: Delete a resume analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /resumes/stats:
    get:
      operationId: getResumeStats
      tags: [resumes]
      summary: Get aggregate stats for all analyzed resumes
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AnalyzeResumeBody:
      type: object
      properties:
        content:
          type: string
          description: The raw resume text content
        jobTitle:
          type: ["string", "null"]
          description: Optional target job title for context-aware analysis
        jobDescription:
          type: ["string", "null"]
          description: Optional job description to compare the resume against
      required:
        - content

    Resume:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        jobTitle:
          type: ["string", "null"]
        jobDescription:
          type: ["string", "null"]
        matchScore:
          type: ["integer", "null"]
          description: How well the resume matches the job description, 0-100 (null without a job description)
        matchedSkills:
          type: array
          items:
            type: string
          description: Skills and requirements from the job description that the resume shows
        experienceGaps:
          type: array
          items:
            type: string
          description: Experience or qualifications the job description asks for that the resume lacks
        overallScore:
          type: integer
          description: Overall resume score 0-100
        summary:
          type: string
          description: AI-generated summary of the resume
        strengths:
          type: array
          items:
            type: string
          description: List of key strengths identified
        weaknesses:
          type: array
          items:
            type: string
          description: List of areas for improvement
        suggestions:
          type: array
          items:
            type: string
          description: Actionable improvement suggestions
        keywords:
          type: array
          items:
            type: string
          description: Important keywords found in the resume
        missingKeywords:
          type: array
          items:
            type: string
          description: Suggested keywords to add
        sectionScores:
          $ref: "#/components/schemas/SectionScores"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - jobTitle
        - jobDescription
        - matchScore
        - matchedSkills
        - experienceGaps
        - overallScore
        - summary
        - strengths
        - weaknesses
        - suggestions
        - keywords
        - missingKeywords
        - sectionScores
        - createdAt

    SectionScores:
      type: object
      properties:
        contactInfo:
          type: integer
        workExperience:
          type: integer
        education:
          type: integer
        skills:
          type: integer
        formatting:
          type: integer
        impact:
          type: integer
      required:
        - contactInfo
        - workExperience
        - education
        - skills
        - formatting
        - impact

    ResumeStats:
      type: object
      properties:
        totalAnalyzed:
          type: integer
        averageScore:
          type: number
        topScoreRange:
          type: string
        commonWeaknesses:
          type: array
          items:
            type: string
      required:
        - totalAnalyzed
        - averageScore
        - topScoreRange
        - commonWeaknesses
